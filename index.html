<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ほんだな">
<meta name="theme-color" content="#2f6f62">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほんだな – 読書記録</title>
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--tx:#2b2622;--sub:#8a8179;--ac:#2f6f62;--ac2:#e9efe9;--line:#e4ddd3;--warn:#b5483a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#262320;--tx:#efe9e1;--sub:#a1978c;--ac:#6fc2af;--ac2:#27342f;--line:#38332e;--warn:#e07a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#262320;--tx:#efe9e1;--sub:#a1978c;--ac:#6fc2af;--ac2:#27342f;--line:#38332e;--warn:#e07a6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;font-size:24px;margin:8px 0 14px;letter-spacing:.04em}
h2{font-size:15px;margin:20px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:8px 0;border:1px solid var(--line);background:none;border-radius:20px;color:var(--sub)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.bk{cursor:pointer;background:none;border:0;padding:0;text-align:left}
.cv{position:relative;aspect-ratio:2/3;border-radius:3px 8px 8px 3px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:inset 5px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.18);overflow:hidden}
.cv b{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:13px;line-height:1.35;word-break:break-all}
.cv i{font-style:normal;font-size:10px;opacity:.85}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.pg span{display:block;height:100%;background:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.sub{color:var(--sub);font-size:13px}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 16px;border-radius:10px}
.btn.g{background:none;border:1px solid var(--line);color:var(--tx)}
.btn.d{background:none;color:var(--warn);border:1px solid var(--line)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);border-radius:8px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.timer{font-size:36px;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0 10px;letter-spacing:.05em}
.star{background:none;border:0;font-size:24px;padding:0 2px;color:var(--line)}
.star.on{color:#e0a526}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px}
.cal .h{aspect-ratio:auto;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.bars span{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.note{border-left:3px solid var(--ac);padding:2px 10px;margin:10px 0}
.empty{text-align:center;color:var(--sub);padding:48px 0}
.back{background:none;border:0;color:var(--ac);padding:4px 0;margin-bottom:6px}
.x{background:none;border:0;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K="honmory-v1";
const COLORS=["#2f6f62","#b5483a","#3d5a80","#8a6a3b","#6b4e71","#4a6b3a","#a65d3f","#445260"];
const ST={reading:"読書中",want:"読みたい",done:"読了"};
const cov=b=>b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
function seed(){return {goal:2,books:[
{id:1,title:"吾輩は猫である",author:"夏目漱石",pages:480,cur:120,status:"reading",rating:0,color:COLORS[0],sessions:[{d:today(),min:25,pg:30}],notes:[{d:today(),pg:42,text:"猫の視点から人間を観察する皮肉が面白い。"}]},
{id:2,title:"走れメロス",author:"太宰治",pages:60,cur:60,status:"done",rating:4,color:COLORS[1],fin:today(),sessions:[{d:today(),min:40,pg:60}],notes:[]},
{id:3,title:"銀河鉄道の夜",author:"宮沢賢治",pages:150,cur:0,status:"want",rating:0,color:COLORS[2],sessions:[],notes:[]}]}}
function load(){try{const j=JSON.parse(localStorage.getItem(K));if(j&&j.books)return j}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),V={tab:"shelf",f:"reading",open:null,add:false,mo:0},T=null,tick=null;
const $=id=>document.getElementById(id);
const book=id=>S.books.find(b=>b.id===id);
const pct=b=>b.pages?Math.min(100,Math.round(b.cur/b.pages*100)):0;

function render(){
 const a=$("app");
 if(V.add)a.innerHTML=addView();
 else if(V.open)a.innerHTML=detailView(book(V.open));
 else a.innerHTML=mainView();
 if(T&&V.open===T.id)startTick();
}
function mainView(){
 return `<h1>ほんだな</h1><div class="tabs">
 <button class="${V.tab==="shelf"?"on":""}" onclick="V.tab='shelf';render()">本棚</button>
 <button class="${V.tab==="stats"?"on":""}" onclick="V.tab='stats';render()">記録</button></div>`
 +(V.tab==="shelf"?shelfView()+`<button class="fab" aria-label="本を追加" onclick="V.add=true;render()">＋</button>`:statsView());
}
function shelfView(){
 const tabs=Object.keys(ST).map(k=>`<button class="${V.f===k?"on":""}" onclick="V.f='${k}';render()">${ST[k]} ${S.books.filter(b=>b.status===k).length}</button>`).join("");
 const list=S.books.filter(b=>b.status===V.f);
 return `<div class="tabs">${tabs}</div>`+(list.length?`<div class="grid">${list.map(b=>`<button class="bk" onclick="V.open=${b.id};render()"><div class="cv" style="background:${b.color}"><b>${esc(b.title)}</b><i>${esc(b.author)}</i>${cov(b)}</div>${b.status==="reading"?`<div class="pg"><span style="width:${pct(b)}%"></span></div>`:""}</button>`).join("")}</div>`:`<div class="empty">この棚にはまだ本がありません。<br>右下の＋から追加できます。</div>`);
}
function addView(){V.isbn="";V.cover="";
 return `<button class="back" onclick="stopScan();V.add=false;render()">‹ 戻る</button><h1>本を追加</h1><div class="card">
 <label style="margin-top:0">ISBN・タイトルで探す</label><div class="row"><input id="q" placeholder="ISBN または タイトル" onkeydown="if(event.key==='Enter')search()"><button class="btn" style="flex:none" onclick="search()">検索</button></div>
 <div class="row" style="margin-top:8px"><button class="btn g sp" onclick="scan()">📷 バーコード</button><label class="btn g sp" style="margin:0;font-size:16px;text-align:center;color:var(--tx);cursor:pointer">写真から読み取る<input type="file" accept="image/*" capture="environment" hidden onchange="scanFile(this.files[0])"></label></div>
 <video id="vid" playsinline muted style="display:none;width:100%;border-radius:8px;margin-top:8px"></video><div id="res"></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:16px 0 0">
 <label>タイトル</label><input id="t" placeholder="例：坊っちゃん">
 <label>著者</label><input id="au">
 <label>総ページ数</label><input id="pp" type="number" min="1" inputmode="numeric">
 <label>状態</label><select id="st"><option value="want">読みたい</option><option value="reading" selected>読書中</option><option value="done">読了</option></select>
 <div class="row" style="margin-top:16px"><button class="btn sp" onclick="addBook()">保存</button></div></div>`;
}
function addBook(){
 const t=$("t").value.trim();if(!t){$("t").focus();return}stopScan();
 const id=Date.now(),st=$("st").value,pages=+$("pp").value||0;
 S.books.push({id,title:t,author:$("au").value.trim(),pages,cur:st==="done"?pages:0,status:st,rating:0,color:COLORS[id%COLORS.length],fin:st==="done"?today():null,isbn:V.isbn||"",cover:V.cover||"",sessions:[],notes:[]});V.isbn="";V.cover="";
 save();V.add=false;V.f=st;render();
}
function detailView(b){
 const run=T&&T.id===b.id;
 const mins=b.sessions.reduce((s,x)=>s+x.min,0);
 return `<button class="back" onclick="V.open=null;render()">‹ 本棚</button>
 <div class="card row" style="align-items:flex-start"><div class="cv" style="background:${b.color};width:84px;flex:none"><b style="font-size:11px">${esc(b.title)}</b>${cov(b)}</div>
 <div class="sp"><div style="font-weight:700;font-size:17px">${esc(b.title)}</div><div class="sub">${esc(b.author)||"著者未設定"}</div>
 <select style="margin-top:8px" onchange="setSt(${b.id},this.value)">${Object.keys(ST).map(k=>`<option value="${k}" ${b.status===k?"selected":""}>${ST[k]}</option>`).join("")}</select>
 <div style="margin-top:6px">${[1,2,3,4,5].map(n=>`<button class="star ${b.rating>=n?"on":""}" aria-label="評価${n}" onclick="rate(${b.id},${n})">★</button>`).join("")}</div></div></div>
 <div class="card"><div class="row"><b>${b.cur}${b.pages?` / ${b.pages}`:""} ページ</b><span class="sp"></span><span class="sub">${pct(b)}%・累計 ${Math.floor(mins/60)}時間${mins%60}分</span></div>
 <div class="pg" style="height:8px"><span style="width:${pct(b)}%"></span></div></div>
 <div class="card"><div class="timer" id="tm">${run?"":"00:00:00"}</div>
 <div class="row"><button class="btn sp" onclick="${run?"stopT()":`startT(${b.id})`}">${run?"■ 停止":"▶ 読書スタート"}</button></div>
 <label>読書時間（分）</label><input id="lm" type="number" min="0" inputmode="numeric" value="${T&&T.min?T.min:""}">
 <label>読んだところまで（ページ）</label><input id="lp" type="number" min="0" inputmode="numeric" value="${b.cur||""}">
 <button class="btn g" style="margin-top:12px;width:100%" onclick="logS(${b.id})">この内容で記録</button></div>
 <h2>メモ・引用</h2><div class="card"><textarea id="nt" rows="3" placeholder="心に残った一文や感想"></textarea>
 <button class="btn g" style="margin-top:8px" onclick="addNote(${b.id})">メモを追加</button>
 ${b.notes.slice().reverse().map((n,i)=>`<div class="note"><div>${esc(n.text).replace(/\n/g,"<br>")}</div><div class="sub">${n.d}${n.pg?`・p.${n.pg}`:""} <button class="x" onclick="delNote(${b.id},${b.notes.length-1-i})">削除</button></div></div>`).join("")}</div>
 <button class="btn d" onclick="delBook(${b.id})">この本を削除</button>`;
}
const fmt=s=>[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,"0")).join(":");
function startT(id){T={id,start:Date.now()};render()}
function startTick(){clearInterval(tick);const u=()=>{const e=$("tm");if(e&&T)e.textContent=fmt(Math.floor((Date.now()-T.start)/1000));else clearInterval(tick)};u();tick=setInterval(u,500)}
function stopT(){const m=Math.max(1,Math.round((Date.now()-T.start)/60000));T={id:T.id,min:m,start:0};clearInterval(tick);const id=T.id;T=null;render();$("lm").value=m;$("lp").focus()}
function logS(id){
 const b=book(id),m=+$("lm").value||0,p=+$("lp").value||0;
 if(!m&&p===b.cur)return;
 b.sessions.push({d:today(),min:m,pg:Math.max(0,p-b.cur)});
 if(p>0)b.cur=b.pages?Math.min(p,b.pages):p;
 if(b.status==="want")b.status="reading";
 if(b.pages&&b.cur>=b.pages){b.status="done";b.fin=b.fin||today()}
 save();render();
}
function setSt(id,v){const b=book(id);b.status=v;if(v==="done"){b.fin=today();if(b.pages)b.cur=b.pages}save();render()}
function rate(id,n){const b=book(id);b.rating=b.rating===n?0:n;save();render()}
function addNote(id){const t=$("nt").value.trim();if(!t)return;const b=book(id);b.notes.push({d:today(),pg:b.cur,text:t});save();render()}
function delNote(id,i){book(id).notes.splice(i,1);save();render()}
function delBook(id){if(!confirm("この本と記録を削除しますか？"))return;S.books=S.books.filter(b=>b.id!==id);save();V.open=null;render()}

function statsView(){
 const now=new Date(),ref=new Date(now.getFullYear(),now.getMonth()+V.mo,1);
 const y=ref.getFullYear(),m=ref.getMonth(),pre=y+"-"+String(m+1).padStart(2,"0");
 const all=S.books.flatMap(b=>b.sessions);
 const ms=all.filter(s=>s.d.startsWith(pre));
 const min=ms.reduce((s,x)=>s+x.min,0),pg=ms.reduce((s,x)=>s+x.pg,0);
 const done=S.books.filter(b=>b.fin&&b.fin.startsWith(pre)).length;
 const byDay={};all.forEach(s=>byDay[s.d]=(byDay[s.d]||0)+s.min);
 const first=ref.getDay(),days=new Date(y,m+1,0).getDate();
 let cells=["日","月","火","水","木","金","土"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
 for(let d=1;d<=days;d++){
  const k=pre+"-"+String(d).padStart(2,"0"),v=byDay[k]||0,isT=k===today();
  const al=v?Math.min(1,.25+v/90):0;
  cells+=`<div style="${v?`background:var(--ac);color:#fff;opacity:${.45+al*.55}`:""};${isT?"outline:2px solid var(--ac)":""}">${d}</div>`;
 }
 const g=S.goal||1;
 return `<div class="card"><div class="row"><button class="x" onclick="V.mo--;render()" aria-label="前の月">‹</button><b class="sp" style="text-align:center">${y}年${m+1}月</b><button class="x" onclick="V.mo++;render()" aria-label="次の月">›</button></div>
 <div class="stats" style="margin:12px 0"><div><b>${done}</b><span class="sub">読了(冊)</span></div><div><b>${Math.floor(min/60)}<small style="font-size:12px">時間</small>${min%60}<small style="font-size:12px">分</small></b><span class="sub">読書時間</span></div><div><b>${pg}</b><span class="sub">ページ</span></div></div>
 <div class="cal">${cells}</div></div>
 <div class="card"><div class="row"><b>今月の目標</b><span class="sp"></span><span class="sub">${done} / ${g} 冊</span></div>
 <div class="pg" style="height:8px"><span style="width:${Math.min(100,done/g*100)}%"></span></div>
 <div class="row" style="margin-top:10px"><span class="sub sp">目標冊数</span><button class="btn g" onclick="goal(-1)">－</button><button class="btn g" onclick="goal(1)">＋</button></div></div>
 <div class="card"><b>バックアップ</b><div class="sub" style="margin:4px 0 10px">記録はこの端末のブラウザ内にだけ保存されています。ときどき書き出しておくと安心です。</div>
 <div class="row"><button class="btn sp" onclick="exportData()">書き出し</button><label class="btn g sp" style="margin:0;font-size:16px;text-align:center;color:var(--tx);cursor:pointer">復元<input type="file" accept=".json,application/json" hidden onchange="importFile(this.files[0])"></label></div>
 <div id="bkm" class="sub" style="margin-top:8px"></div>
 <details style="margin-top:8px"><summary class="sub">テキストで書き出し・復元</summary><textarea id="bkt" rows="4" style="margin-top:8px" placeholder="ここにバックアップの内容を貼り付け"></textarea><div class="row" style="margin-top:8px"><button class="btn g sp" onclick="showData()">現在のデータを表示</button><button class="btn g sp" onclick="importText()">貼り付けで復元</button></div></details></div>`;
}
function goal(n){S.goal=Math.max(1,(S.goal||1)+n);save();render()}

/* ---- バックアップ ---- */
const bm=t=>{const e=$("bkm");if(e)e.textContent=t};
async function exportData(){
 const json=JSON.stringify(S);
 try{
  const dl=window.claude&&await claude.use("downloads");
  if(!dl){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download="honmory-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();return bm("書き出しました。")}
  await dl.save({filename:"honmory-backup-"+today()+".json",data:json});bm("書き出しました。");
 }catch(e){
  if(e&&e.code==="declined")return bm("キャンセルしました。");
  showData();bm("ファイルで保存できないため、下のテキストをコピーして保管してください。");
  const d=document.querySelector("details");if(d)d.open=true;
 }
}
function showData(){const t=$("bkt");if(t){t.value=JSON.stringify(S);t.select()}}
function restore(txt){
 try{
  const j=JSON.parse(txt);if(!j||!Array.isArray(j.books))throw 0;
  if(!confirm("現在の記録を、バックアップ（本"+j.books.length+"冊）の内容で置き換えますか？"))return;
  S={goal:j.goal||1,books:j.books};save();V={tab:"stats",f:"reading",open:null,add:false,mo:0};render();
 }catch(e){bm("バックアップとして読み込めませんでした。")}
}
async function importFile(f){if(f)restore(await f.text())}
function importText(){restore($("bkt").value.trim())}

/* ---- 書籍検索・バーコード ---- */
let R=[],stream=null,AIERR="",AIDBG="",WEBERR="";
function parseList(r){const t=typeof r==="string"?r:(r&&r.text)||"";AIDBG=t.slice(0,80);const m=t.match(/\[[\s\S]*\]/);if(m)return JSON.parse(m[0]);const o=t.match(/\{[\s\S]*\}/);if(!o)return[];const j=JSON.parse(o[0]);return j.books||j.results||j.items||[]}
const cleanIsbn=s=>(s||"").replace(/[^0-9Xx]/g,"");
const isIsbn=s=>/^(97[89]\d{10}|\d{9}[\dXx])$/.test(s);
function msg(t){$("res").innerHTML=`<div class="sub" style="margin-top:10px">${t}</div>`}
function showR(){
 if(!R.length){
  const m={unavailable:"見つかりませんでした。入力内容を確認するか、下のフォームから手入力で追加してください。",not_granted:"AI検索の許可が必要です。許可してもう一度検索してください。",rate_limited:"利用が集中しています。しばらく待ってから再試行してください。"}[AIERR];
  return msg((m||"見つかりませんでした。ISBNはAIが判別できないことがあるので、タイトルで検索するか手入力してください。")+(AIERR&&!m?"（"+AIERR+"）":"")+(AIDBG?"（応答: "+esc(AIDBG)+"）":"")+(WEBERR?"（通信: "+esc(WEBERR)+"）":""));
 }
 $("res").innerHTML=R.map((r,i)=>`<button class="card" style="width:100%;text-align:left;margin:8px 0 0;display:flex;gap:10px;align-items:center" onclick="pick(${i})">${r.cover?`<img src="${esc(r.cover)}" alt="" referrerpolicy="no-referrer" style="width:40px;border-radius:3px" onerror="this.remove()">`:""}<div><b>${esc(r.title)}</b><div class="sub">${esc(r.author)}${r.pages?`・${r.pages}ページ`:""}・検索元: ${r.ai?"AI推定":esc(r.src)}</div></div></button>`).join("")+(R.some(r=>r.ai)?`<div class="sub" style="margin-top:8px">※AIによる推定です。タイトル・ページ数は確認してください。</div>`:"");
}
function pick(i){const r=R[i];$("t").value=r.title||"";$("au").value=r.author||"";$("pp").value=r.pages||"";V.isbn=r.isbn||V.isbn||"";V.cover=r.cover||"";$("res").innerHTML=""}
async function search(code){
 const q=(typeof code==="string"?code:$("q").value).trim();if(!q)return;
 $("q").value=q;msg("検索中…");
 const n=cleanIsbn(q),isb=isIsbn(n);if(isb)V.isbn=n;
 AIERR="";AIDBG="";WEBERR="";R=await lookupWeb(q,isb?n:"");
 if(!R.length)R=await lookupAI(isb?n:q,isb);
 showR();
}
async function gb(q){
 const j=await(await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=8&q="+encodeURIComponent(q))).json();
 return(j.items||[]).map(x=>{const v=x.volumeInfo||{};return{title:(v.title||"")+(v.subtitle?" "+v.subtitle:""),author:(v.authors||[]).join(", "),pages:v.pageCount,isbn:((v.industryIdentifiers||[]).find(i=>i.type==="ISBN_13")||{}).identifier,cover:((v.imageLinks||{}).thumbnail||"").replace("http://","https://").replace("&edge=curl",""),src:"Google Books"}});
}
async function lookupWeb(q,isbn){
 let out=[];
 try{
  if(isbn){
   const j=await(await fetch("https://api.openbd.jp/v1/get?isbn="+isbn)).json();
   const s=j&&j[0]&&j[0].summary;
   if(s){out=[{title:s.title,author:s.author,isbn,cover:s.cover||"",src:"openBD"}];
    try{const g=await gb("isbn:"+isbn);if(g[0]){if(g[0].pages)out[0].pages=g[0].pages;if(!out[0].cover)out[0].cover=g[0].cover}}catch(e){}}
   else out=await gb("isbn:"+isbn);
  }else out=await gb(q);
 }catch(e){WEBERR=String((e&&e.message)||e)}
 return out;
}
async function lookupAI(q,isbn){
 try{
  const sm=window.claude&&await claude.use("sample");if(!sm){AIERR="unavailable";return[]}
  const rs=await sm(`書籍検索です。${isbn?"ISBN":"キーワード"}「${q}」に該当する実在の書籍を最大8件、JSON配列のみで返してください。要素は{"title":"","author":"","pages":数値またはnull,"isbn":"ISBN13または空文字"}。${isbn?"このISBNの書籍が分からない場合のみ[]を返してください。":"タイトルや著者名が部分一致・表記ゆれでも、最も近い実在の書籍を候補として必ず挙げてください。ページ数が不明ならnull。"}存在しない書籍は作らないでください。`,{cache:false,modelTier:"complex"});const v=parseList(rs);
  return Array.isArray(v)?v.slice(0,8).filter(x=>x&&x.title).map(x=>({...x,ai:true})):[];
 }catch(e){AIERR=(e&&e.code)||"error";return[]}
}
function loadZX(){return window.ZXing?Promise.resolve():new Promise((ok,ng)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.18.6/index.min.js";s.onload=ok;s.onerror=ng;document.head.appendChild(s)})}
async function decodeImg(f){
 if("BarcodeDetector" in window){const r=await new BarcodeDetector({formats:["ean_13"]}).detect(await createImageBitmap(f));return r[0]&&r[0].rawValue}
 await loadZX();const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(URL.createObjectURL(f));return r.getText();
}
async function scanFile(f){
 if(!f)return;msg("読み取り中…");
 try{const c=await decodeImg(f);if(c)search(c);else msg("バーコードを読み取れませんでした。ISBNを手入力してください。")}
 catch(e){msg("読み取りに失敗しました。ISBNを手入力してください。")}
}
async function scan(){
 if(stream){stopScan();return}
 if(!("BarcodeDetector" in window)||!navigator.mediaDevices){msg("このブラウザはライブ読み取りに未対応です。「写真から読み取る」をお使いください。");return}
 try{
  const v=$("vid");stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  v.srcObject=stream;v.style.display="block";await v.play();msg("裏表紙の「978」で始まるバーコードを映してください。");
  const det=new BarcodeDetector({formats:["ean_13"]});
  const loop=async()=>{if(!stream)return;try{const c=(await det.detect(v)).map(x=>x.rawValue).find(x=>/^97[89]/.test(x));if(c){stopScan();search(c);return}}catch(e){}setTimeout(loop,300)};loop();
 }catch(e){stopScan();msg("カメラを使えませんでした。「写真から読み取る」か手入力をお使いください。")}
}
function stopScan(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const v=$("vid");if(v)v.style.display="none"}
render();
</script>
